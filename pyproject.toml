[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "live-recorder-danmaku"
version = "0.1.0"
description = "Burn timestamped XML danmaku into local videos"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
keywords = ["danmaku", "video", "ffmpeg"]
requires-python = ">=3.10"
dependencies = ["Pillow>=9.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
live-recorder = "live_recorder.cli:main"

[tool.setuptools.packages.find]
include = ["live_recorder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
